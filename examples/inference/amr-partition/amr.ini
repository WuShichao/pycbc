# A PyCBC inference configuration that loads the AMR cell partition.
#
# WHAT THIS PRODUCES IS NOT A CHAIN.  `name = amr` selects a deterministic grid
# quadrature over a fixed AMR partition: each cell contributes a centre, a
# volume and an amplitude-marginalised Bayes factor, and the posterior is the
# weighted histogram of the cell centres.  There is no stochastic sampler, no
# burn-in and no evidence error estimate; dlog_evidence is written as nan.
#
# The physics already ran in the companion repository.  This config reads its
# `posteriors.npz` and maps the weighted partition into PyCBC's samples format.
# Set `enable-research = true` (and point `amr-root` at the companion
# repository) to run the research AMR live on a CUDA GPU instead.

[model]
name = test_normal

[sampler]
name = amr

[sampler-amr]
# source of the partition: a stored research result, or a live research run
enable-research = false
partition-file = /mnt/d/lisa_tests_with_cc/results/2026-10-18/amr_sampler/posteriors.npz
partition-level = last
amr-root = /mnt/d/lisa_tests_with_cc

# the refinement, used only when enable-research = true; recorded in the output
refinement = both
eps = 3e-4
n-fmax = 100
max-cells = 45000
max-level = 6

# evidence: the Riemann sum over the partition, or none (nan)
evidence = quadrature

# which of the six eta coordinates are the reported parameters
eta-columns = 0 1 2 3

# The exact projection from those shape coordinates to the physical parameters.
# The eta axes are a rotation and rescaling of the physical offsets, so they are
# not physical parameters: the map stores the geometry (lam, E), the reference
# values, the shape scales and the recorded injection, and the adapter writes
# mchirp, q, spin1z, spin2z, eclipticlongitude and eclipticlatitude beside the
# eta columns through xi = E diag(1/sqrt(lam)) eta, p = p_ref + sigma_p xi_p.
# Relative to the directory pycbc_inference is run from.
physical-map = examples/inference/amr-partition/physical-map.json

# The archived (D, Gram) sufficient statistics, one row per (cell, lag), from
# the research demarginalisation pass.  With this file the adapter draws one
# sample per cell from the JOINT over (lag, orientation node, amplitude u) and
# writes the ordinary samples columns inclination, polarization, delta_tc,
# amplitude_u and distance_ratio.  They are conditional columns, not sampled
# dimensions; see the sampler docstring.  The live research path produces no
# archive, so remove this option when enable-research = true.
sufficient-file = /mnt/d/lisa_tests_with_cc/results/2026-10-18/demarginalisation/sufficient_full.npz

# The amplitude prior p(u) ~ u^-power on [1, U], u = A/A_min.  The registered
# pair (power 4, ceiling 5) truncates the likelihood of this injection (its
# mode is near u = 7.15) and drives the orientation to the face-on corner; the
# corrected default ceiling 20 contains it.  Set both to 4 and 5 to reproduce
# the registered file.
amplitude-ceiling = 20
amplitude-power = 4

# The seed of the joint (lag, node, amplitude) draw, so a file is reproducible.
recovered-seed = 20261018

# The recorded injection of the research partition (fixed_signal), written as
# truth attributes and into the injections group.  It is not the LAL ini's
# inclination 1.287 / polarization 0.5012 / coa_phase 2.2689.
injection-inclination = 1.0
injection-polarization = 0.7
injection-coa-phase = 0.3

[variable_params]
eta_0 =
eta_1 =
eta_2 =
eta_3 =

# The research prior is flat over the ellipsoid
#   sum_a (xi_a / s_a)^2 <= 1,   s = (50, 50, 50, 50, ...)
# which in the four stiff eta coordinates is the quadratic form below.  The
# uniform boxes are its bounding box; the constraint makes the prior exactly the
# research prior.  The matrix was recovered from the companion repository's
# geometry.json (lam, E, w) by solving w_i^2 = sum_a lam_i E_{a i}^2 s_a^2 for
# s; see notes/2026/10/2026-10-18-amr-sampler-pycbc-integration.md.
[prior-eta_0]
name = uniform
min-eta_0 = -2.89
max-eta_0 = 2.89

[prior-eta_1]
name = uniform
min-eta_1 = -0.46
max-eta_1 = 0.46

[prior-eta_2]
name = uniform
min-eta_2 = -0.44
max-eta_2 = 0.44

[prior-eta_3]
name = uniform
min-eta_3 = -0.73
max-eta_3 = 0.73

[constraint-region]
name = custom
constraint_arg = (0.16007295*eta_0**2 + 23.15252909*eta_1**2 + 27.0213595*eta_2**2 + 21.97961936*eta_3**2 - 1.74068666*eta_0*eta_1 - 1.73071806*eta_0*eta_2 - 1.8160108*eta_0*eta_3 + 26.57146128*eta_1*eta_2 + 37.45877228*eta_1*eta_3 + 41.0134454*eta_2*eta_3 <= 1)
