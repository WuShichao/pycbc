# PyCBC inference of the exact-TDI likelihood of the controlled STBBH event.
#
# What this is.  `name = exact_tdi` selects a model that evaluates the
# controlled event's exact-TDI likelihood with the campaign's own objects: the
# data from ExactTDI.spectrum/weight and the noise draw, and the response,
# correlation and Gram from ssb_amr.Run, which is the object the AMR
# partition's cell Bayes factors are built from.  `name = nessai` is an
# independent sampler.  Any other PyCBC sampler can be substituted by changing
# the sampler section, which is the point of the model.
#
# The companion repository must be readable at amr-root; the model imports its
# data, response, geometry and noise code rather than reimplementing them.
#
# THE EVENT.  The controlled injection of
# results/2026-10-18/amr_sampler/amr_sampler.py: intrinsic shape coordinates
# xi = (3, -2, 1.5, -1), sky at the patch centre, inclination 1.0,
# polarization 0.7, coalescence phase 0.3, arrival time 0, rho = 16, noise
# seed 20261018.  These are the values recorded by the flat AMR file
# results/2026-10-19/orientation_interpolated/
# amr_pycbc_distance_flat_orientation_interp.hdf.
#
# THE PRIOR.  The AMR's four-dimensional ellipsoid in the stiff shape
# coordinates, flat in cos(inclination) (sin_angle), flat in polarization on
# [0, pi/2), the flat amplitude prior p(u) ~ u^0 on [1, 20] with the campaign's
# distance = K / u, and a uniform arrival time around the recorded event.  The
# amplitude prior section also expresses the other two priors of the project;
# see the comment there.
#
# THE PHASE.  marginalize-phase = true integrates the coalescence phase
# analytically (the I0 marginal), which is the same marginalisation the AMR
# applies.  Inclination and polarization remain sampled, and the template is
# built at the sampled pair, so the two polarization amplitudes are separate.

[model]
name = exact_tdi
# pointwise: sample inclination, polarization, amplitude and arrival time, so
# the two polarization amplitudes are separate.  campaign: reproduce the
# campaign's orientation-and-amplitude-marginalised PosteriorAMR.lnB exactly
# (eta only); see the model docstring.
likelihood = pointwise
# family mode uses the campaign's ssb_amr.Run object (the AMR's own family,
# correlation and Gram); exact mode calls ExactTDI.spectrum at every point and
# costs seconds per call instead of milliseconds
response = family
batch = 1
amr-root = /mnt/d/lisa_tests_with_cc
injection-xi = 3.0 -2.0 1.5 -1.0
injection-inclination = 1.0
injection-polarization = 0.7
injection-coa-phase = 0.3
injection-delta-tc = 0.0
rho = 16.0
noise-seed = 20261018
# distance = distance-constant / amplitude_u, in Mpc
distance-constant = 542.1005802811611
# integrate the coalescence phase analytically
marginalize-phase = true
# the campaign's amplitude table omits the 2*pi flat-phase constant; keeping
# it out here makes the family likelihood match the AMR's lnB numerically
include-phase-normalization = false

[variable_params]
eta_0 =
eta_1 =
eta_2 =
eta_3 =
inclination =
polarization =
amplitude_u =
delta_tc =

# The research prior is flat over the ellipsoid
#   sum_a (xi_a / s_a)^2 <= 1,   s = (50, 50, 50, 50, ...)
# which in the four stiff eta coordinates is the quadratic form below.  The
# uniform boxes are its bounding box; the constraint makes the prior exactly the
# research prior.  The boxes and the quadratic are the ones in amr.ini.
[prior-eta_0]
name = uniform
min-eta_0 = -2.89
max-eta_0 = 2.89

[prior-eta_1]
name = uniform
min-eta_1 = -0.46
max-eta_1 = 0.46

[prior-eta_2]
name = uniform
min-eta_2 = -0.44
max-eta_2 = 0.44

[prior-eta_3]
name = uniform
min-eta_3 = -0.73
max-eta_3 = 0.73

[constraint-region]
name = custom
constraint_arg = (0.16007295*eta_0**2 + 23.15252909*eta_1**2 + 27.0213595*eta_2**2 + 21.97961936*eta_3**2 - 1.74068666*eta_0*eta_1 - 1.73071806*eta_0*eta_2 - 1.8160108*eta_0*eta_3 + 26.57146128*eta_1*eta_2 + 37.45877228*eta_1*eta_3 + 41.0134454*eta_2*eta_3 <= 1)

# Flat in cos(inclination): p(iota) proportional to sin(iota) on [0, pi].
[prior-inclination]
name = sin_angle
min-inclination = 0
max-inclination = 3.141592653589793

# psi and psi + pi/2 are the same model point once the phase is marginalised.
[prior-polarization]
name = uniform
min-polarization = 0
max-polarization = 1.5707963267948966

# The amplitude prior of this run: flat on [1, 20].  The other two priors the
# project uses are the same section with
#   power = 4, max-amplitude_u = 5     (registered, volume prior)
#   power = 4, max-amplitude_u = 20    (corrected ceiling, volume prior)
# Power 4 is p(u) proportional to u**-4, the volumetric prior induced by a
# uniform-in-distance prior on u = K / d.
[prior-amplitude_u]
name = uniform_amplitude_power_law
power = 0
min-amplitude_u = 1
max-amplitude_u = 20

# The exact-TDI likelihood peaks within a few tens of seconds of the recorded
# arrival time; the AMR's stored lags span about 1.9e3 s.  This window covers
# both and keeps the sampled volume small.
[prior-delta_tc]
name = uniform
min-delta_tc = -400
max-delta_tc = 400

[sampler]
name = nessai
nlive = 1000
seed = 20261019
stopping = 0.1
max_iteration = 5000
# Checkpoint every ten minutes, as the rest of the project does.
checkpointing = True
checkpoint_interval = 600
# The diagnostics that default to false.  plot_history, plot_chain and
# proposal_plots write the sampler's own figures; save_training_data keeps the
# flow training set for the convergence read.
plot = True
plot_history = True
plot_chain = True
proposal_plots = True
save_training_data = True
