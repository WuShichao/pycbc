# A minimal AMR cell-partition example.
#
# `name = amr` selects a deterministic grid quadrature over a fixed adaptive
# partition: each cell contributes its centre, its volume and an
# amplitude-marginalised Bayes factor, and the posterior is the weighted
# histogram of the cell centres.  There is no chain, no burn-in and no evidence
# error estimate; dlog_evidence is written as nan.
#
# The data are synthetic.  Run make_demo_data.py first (from the top of the
# checkout) to write amr-demo-data/posteriors.npz and the physical map.

[model]
name = test_normal

[sampler]
name = amr

[sampler-amr]
# read the weighted partition written by make_demo_data.py
enable-research = false
partition-file = examples/inference/amr-partition/amr-demo-data/posteriors.npz
partition-level = last
evidence = quadrature

# which of the six chart coordinates are the reported parameters
eta-columns = 0 1 2 3

# the projection from those chart coordinates to mchirp and q, also written by
# make_demo_data.py; relative to the directory pycbc_inference is run from
physical-map = examples/inference/amr-partition/amr-demo-data/physical-map.json

[variable_params]
eta_0 =
eta_1 =
eta_2 =
eta_3 =

# The cell centres span [-0.5, 0.5] with unit width; these boxes are wider, so
# every cell is inside the prior.  The sampler is deterministic and does not
# draw from the prior, but a PyCBC model still needs one for the parameters.
[prior-eta_0]
name = uniform
min-eta_0 = -1
max-eta_0 = 1

[prior-eta_1]
name = uniform
min-eta_1 = -1
max-eta_1 = 1

[prior-eta_2]
name = uniform
min-eta_2 = -1
max-eta_2 = 1

[prior-eta_3]
name = uniform
min-eta_3 = -1
max-eta_3 = 1
