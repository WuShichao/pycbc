# A six-column AMR posterior: the four stiff eta coordinates plus the two
# soft ones, eta_4 and eta_5.
#
# READ THIS BEFORE USING THE FIGURE.  The research covering grid refines only
# the four stiff directions; eta_4 and eta_5 are one cell wide in every level
# of the stored partition.  Switching them on therefore produces a six-column
# file of rank four: every cell reports eta_4 = eta_5 = 0 with one width, so
# the posterior is flat across those two cells.  The two columns are also not
# "the sky": the chart is a rotation of the physical offsets, and its sky rows
# are spread over all six columns (the sky is dominated by the stiff ones).
# The physical sky (ecliptic longitude and latitude) is written as a pair of
# physical columns through physical-map-sixdim.json; that is the sky
# projection to read.  The file records amr_posterior_rank = 4 and the
# degenerate columns, and the sampler logs a warning.
#
# The physics already ran in the companion repository.  This config reads its
# `posteriors.npz` and maps the weighted partition into PyCBC's samples
# format.

[model]
name = test_normal

[sampler]
name = amr

[sampler-amr]
enable-research = false
partition-file = /mnt/d/lisa_tests_with_cc/results/2026-10-18/amr_sampler/posteriors.npz
partition-level = last
amr-root = /mnt/d/lisa_tests_with_cc

refinement = both
eps = 3e-4
n-fmax = 100
max-cells = 45000
max-level = 6

evidence = quadrature

# all six chart columns are reported; the first four are the refined ones
eta-columns = 0 1 2 3 4 5

# the six physical columns: mchirp, q, spin1z, spin2z, eclipticlongitude,
# eclipticlatitude
physical-map = examples/inference/amr-partition/physical-map-sixdim.json

[variable_params]
eta_0 =
eta_1 =
eta_2 =
eta_3 =
eta_4 =
eta_5 =

# The research prior is flat over the ellipsoid sum_a (xi_a / s_a)^2 <= 1,
# s = (50, 50, 50, 50, 13.368949, 6.456803) shape units, which in the six eta
# coordinates is the quadratic form below.  The uniform boxes are its bounding
# box; the constraint makes the prior exactly the research prior.  The
# eta_4/eta_5 boxes are the single cell's half-widths at the first level,
# 3.0777997689e-3 and 4.5026468742e-5.
[prior-eta_0]
name = uniform
min-eta_0 = -2.89
max-eta_0 = 2.89

[prior-eta_1]
name = uniform
min-eta_1 = -0.46
max-eta_1 = 0.46

[prior-eta_2]
name = uniform
min-eta_2 = -0.44
max-eta_2 = 0.44

[prior-eta_3]
name = uniform
min-eta_3 = -0.73
max-eta_3 = 0.73

[prior-eta_4]
name = uniform
min-eta_4 = -0.003077799769
max-eta_4 = 0.003077799769

[prior-eta_5]
name = uniform
min-eta_5 = -4.502646874e-05
max-eta_5 = 4.502646874e-05

[constraint-region]
name = custom
constraint_arg = (0.1600729542*eta_0**2 + -1.740686662*eta_0*eta_1 + -1.73071806*eta_0*eta_2 + -1.816010807*eta_0*eta_3 + 0.9668444873*eta_0*eta_4 + -0.08417614092*eta_0*eta_5 + 23.15252909*eta_1**2 + 26.57146128*eta_1*eta_2 + 37.45877227*eta_1*eta_3 + -22.88428515*eta_1*eta_4 + 2.008514726*eta_1*eta_5 + 27.0213595*eta_2**2 + 41.01344539*eta_2*eta_3 + -17.60165354*eta_2*eta_4 + 1.50920627*eta_2*eta_5 + 21.97961936*eta_3**2 + -21.22124157*eta_3*eta_4 + 1.844185175*eta_3*eta_5 + 105570.7758*eta_4**2 + -1.061872281*eta_4*eta_5 + 493246740.1*eta_5**2 <= 1)
